# Grafana datasource auto-provisioning
# This file is read by Grafana at startup via the GF_PATHS_PROVISIONING env var
# set in docker-compose.yml. No manual UI configuration is needed.
#
# Reference:
#   https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-ds
    orgId: 1
    access: proxy
    # "prometheus" resolves to the prometheus service on reviewer-net
    url: http://prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      exemplarTraceIdDestinations: []
