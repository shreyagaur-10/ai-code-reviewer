# Grafana dashboard auto-provisioning
# Grafana scans the 'path' directory for *.json files and imports them.
# The dashboard appears under the "AI Code Reviewer" folder on first login.
#
# Reference:
#   https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards

apiVersion: 1

providers:
  - name: "AI Code Reviewer"
    orgId: 1
    folder: "AI Code Reviewer"
    folderUid: "ai-code-reviewer"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
