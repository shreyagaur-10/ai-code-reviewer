# AI Code Reviewer — docker-compose.yml
# Orchestrates: FastAPI app, ChromaDB, Prometheus, Grafana
# All services share the "reviewer-net" bridge network.
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d

version: "3.9"

networks:
  reviewer-net:
    driver: bridge

volumes:
  chroma-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  model-cache:
    driver: local

services:

  # ── FastAPI application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build args to pass if you want to override at build time
    image: ai-code-reviewer:local
    container_name: ai-code-reviewer-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Override ChromaDB host to point at the chromadb service
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_PERSIST_DIR: /data/chroma
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # Reuse the baked model cache (populated at build time)
      - model-cache:/home/appuser/.cache/huggingface
    depends_on:
      chromadb:
        condition: service_healthy
    networks:
      - reviewer-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── ChromaDB vector store ───────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: ai-code-reviewer-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"    # expose on 8001 to avoid conflict with the app
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    networks:
      - reviewer-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Prometheus metrics collection ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-code-reviewer-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - reviewer-net

  # ── Grafana dashboard ───────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ai-code-reviewer-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Auto-provision Prometheus as a datasource on first start
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - reviewer-net
